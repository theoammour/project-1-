apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base

# Production : 3 replicas pour la haute disponibilite.
replicas:
  - name: demo-api
    count: 3

# Le tag d'image est mis a jour automatiquement par la CI a chaque release.
images:
  - name: demo-api
    newName: demo-api
    newTag: prod
